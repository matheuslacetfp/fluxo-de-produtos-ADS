<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fluxo de Produção de Mídia e Vídeo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

:root {
  --bg-primary: #09090b;
  --bg-surface: #121218;
  --bg-card: #181822;
  --bg-card-hover: #1e1e2c;
  
  --accent-purple: #9d4edd;
  --accent-purple-bright: #b056f5;
  --accent-purple-light: #d8b4fe;
  --accent-purple-glow: rgba(157, 78, 221, 0.25);
  --accent-purple-soft: rgba(157, 78, 221, 0.12);
  --accent-purple-border: rgba(176, 86, 245, 0.35);

  --border-color: #272738;
  --border-subtle: #1f1f2e;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  --font-heading: 'Space Grotesk', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  line-height: 1.6;
  min-height: 100vh;
  padding: clamp(1rem, 4vw, 3.5rem) clamp(0.75rem, 3vw, 1.5rem);
  display: flex;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(157, 78, 221, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(157, 78, 221, 0.05) 0%, transparent 50%);
  background-attachment: fixed;
}

body::before {
  content: '';
  position: fixed;
  inset: -35%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;
  background:
    radial-gradient(ellipse at 18% 25%, rgba(176, 86, 245, 0.18) 0%, transparent 38%),
    radial-gradient(ellipse at 78% 18%, rgba(216, 180, 254, 0.1) 0%, transparent 34%),
    radial-gradient(ellipse at 65% 82%, rgba(94, 53, 145, 0.16) 0%, transparent 42%);
  background-size: 125% 125%;
  filter: blur(18px);
  animation: fluid-gradient 22s ease-in-out infinite alternate;
}

@keyframes fluid-gradient {
  0% {
    transform: translate3d(-4%, -2%, 0) scale(1);
  }
  50% {
    transform: translate3d(3%, 4%, 0) scale(1.06);
  }
  100% {
    transform: translate3d(-2%, 1%, 0) scale(1.02);
  }
}

.ambient-assets {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.ambient-asset {
  position: absolute;
  display: block;
  color: var(--accent-purple-light);
  opacity: 0.12;
  will-change: transform;
}

.asset-frame {
  top: 16%;
  left: 4%;
  width: 116px;
  height: 78px;
  border: 1px solid currentColor;
  border-radius: 8px;
  transform: rotate(-12deg);
  animation: asset-drift-one 26s ease-in-out infinite alternate;
}

.asset-frame::before,
.asset-frame::after {
  content: '';
  position: absolute;
  border: 1px solid currentColor;
  border-radius: 3px;
}

.asset-frame::before {
  inset: 12px;
  opacity: 0.7;
}

.asset-frame::after {
  width: 8px;
  height: 8px;
  top: 8px;
  right: 8px;
  border-radius: 50%;
}

.asset-play {
  top: 64%;
  right: 7%;
  width: 58px;
  height: 58px;
  border: 1px solid currentColor;
  border-radius: 50%;
  transform: rotate(10deg);
  animation: asset-drift-two 32s ease-in-out infinite alternate;
}

.asset-play::before {
  content: '';
  position: absolute;
  top: 17px;
  left: 22px;
  border-top: 11px solid transparent;
  border-bottom: 11px solid transparent;
  border-left: 15px solid currentColor;
}

.asset-wave {
  top: 42%;
  left: 76%;
  width: 150px;
  height: 34px;
  border-top: 1px solid currentColor;
  border-bottom: 1px solid currentColor;
  transform: rotate(-18deg);
  background: repeating-linear-gradient(90deg, transparent 0 7px, currentColor 8px 9px, transparent 10px 15px);
  mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
  animation: asset-drift-three 24s ease-in-out infinite alternate;
}

.asset-bracket {
  top: 78%;
  left: 22%;
  width: 42px;
  height: 42px;
  border-left: 1px solid currentColor;
  border-bottom: 1px solid currentColor;
  transform: rotate(22deg);
  animation: asset-drift-four 30s ease-in-out infinite alternate;
}

@keyframes asset-drift-one {
  0% { transform: translate3d(-12px, 10px, 0) rotate(-12deg); }
  100% { transform: translate3d(42px, -24px, 0) rotate(-4deg); }
}

@keyframes asset-drift-two {
  0% { transform: translate3d(18px, -12px, 0) rotate(10deg); }
  100% { transform: translate3d(-34px, 24px, 0) rotate(-8deg); }
}

@keyframes asset-drift-three {
  0% { transform: translate3d(0, 18px, 0) rotate(-18deg); }
  100% { transform: translate3d(-58px, -30px, 0) rotate(-8deg); }
}

@keyframes asset-drift-four {
  0% { transform: translate3d(8px, 0, 0) rotate(22deg); }
  100% { transform: translate3d(42px, -36px, 0) rotate(48deg); }
}

.container {
  width: 100%;
  max-width: 1240px;
  position: relative;
  z-index: 1;
}

/* Header Section */
header {
  background: linear-gradient(180deg, rgba(24, 24, 34, 0.8) 0%, rgba(18, 18, 24, 0.6) 100%);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: clamp(1.35rem, 4vw, 2.75rem);
  margin-bottom: clamp(2rem, 5vw, 3.5rem);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
}

header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent-purple-light), transparent);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 1.5rem;
}

.title-area h1 {
  font-family: var(--font-heading);
  font-size: clamp(2rem, 5vw, 2.8rem);
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-primary);
  line-height: 1.15;
}

.title-area h1 span {
  color: var(--accent-purple-bright);
  background: linear-gradient(135deg, #c084fc 0%, #9d4edd 100%);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.title-area p {
  color: var(--text-secondary);
  font-size: 1.1rem;
  margin-top: 0.6rem;
  font-weight: 400;
}

.meta-badges {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.badge {
  background-color: var(--accent-purple-soft);
  color: var(--accent-purple-light);
  border: 1px solid var(--accent-purple-border);
  padding: 0.4rem 0.9rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--accent-purple-bright);
}

/* Section Headings */
.section-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.section-number {
  font-family: var(--font-heading);
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent-purple-bright);
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.section-title {
  font-family: var(--font-heading);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.section-block {
  margin-bottom: clamp(2.25rem, 5vw, 3.5rem);
}

/* Cards & Grids */
.grid-5 {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1.25rem;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1.25rem;
}

.card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: clamp(1rem, 2vw, 1.5rem);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}

.card:hover {
  border-color: var(--accent-purple-border);
  background-color: var(--bg-card-hover);
  transform: translateY(-3px);
  box-shadow: 0 12px 24px -10px var(--accent-purple-glow);
}

.card-header-step {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border-subtle);
}

.step-tag {
  font-family: var(--font-heading);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-purple-light);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card-title {
  font-family: var(--font-heading);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-primary);
}

.card-summary {
  color: var(--text-secondary);
  font-size: 0.82rem;
  line-height: 1.45;
  margin-top: 0.65rem;
}

.card-expand-hint {
  color: var(--accent-purple-light);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-top: auto;
  padding-top: 1rem;
  text-transform: uppercase;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 1rem;
  background: rgba(3, 3, 8, 0.78);
  backdrop-filter: blur(8px);
  animation: modal-fade-in 0.2s ease-out both;
}

.card-modal {
  width: min(100%, 620px);
  max-height: min(720px, calc(100vh - 2rem));
  overflow-y: auto;
  background: linear-gradient(145deg, rgba(30, 30, 44, 0.98), rgba(18, 18, 24, 0.98));
  border: 1px solid var(--accent-purple-border);
  border-radius: 16px;
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), 0 0 40px var(--accent-purple-glow);
  padding: clamp(1.25rem, 4vw, 2rem);
  position: relative;
  animation: modal-rise 0.25s ease-out both;
}

.modal-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 2rem;
  height: 2rem;
  border: 1px solid var(--border-color);
  border-radius: 50%;
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 1.25rem;
  line-height: 1;
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.modal-close:hover {
  border-color: var(--accent-purple-bright);
  color: var(--text-primary);
  transform: rotate(90deg);
}

.modal-eyebrow {
  color: var(--accent-purple-light);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.modal-title {
  color: var(--text-primary);
  font-family: var(--font-heading);
  font-size: clamp(1.5rem, 4vw, 2rem);
  line-height: 1.15;
  margin: 0.4rem 3rem 1.25rem 0;
}

.modal-copy {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.65;
}

.modal-details {
  display: grid;
  gap: 0.85rem;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 1.5rem;
}

.modal-detail {
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  border-radius: 8px;
  padding: 0.9rem;
}

.modal-detail strong {
  color: var(--accent-purple-light);
  display: block;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  margin-bottom: 0.3rem;
  text-transform: uppercase;
}

.modal-detail span {
  color: var(--text-secondary);
  font-size: 0.85rem;
  line-height: 1.45;
}

@keyframes modal-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-rise {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Bullet Lists */
ul.bullet-list {
  list-style: none;
  margin-top: 0.25rem;
}

ul.bullet-list li {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-bottom: 0.6rem;
  position: relative;
  padding-left: 1.4rem;
  line-height: 1.45;
}

ul.bullet-list li:last-child {
  margin-bottom: 0;
}

ul.bullet-list li::before {
  content: "›";
  color: var(--accent-purple-bright);
  font-weight: 800;
  font-size: 1.3rem;
  position: absolute;
  left: 0;
  top: -3px;
}

/* Link Button */
.link-btn {
  color: var(--accent-purple-light);
  text-decoration: none;
  font-weight: 600;
  padding: 0.3rem 0.8rem;
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.2s ease;
}

.link-btn:hover {
  background: var(--accent-purple-bright);
  color: #fff;
  border-color: var(--accent-purple-bright);
}

/* Pipelines / Flow Layouts */
.pipeline-container {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: clamp(1rem, 3vw, 1.75rem);
  overflow-x: auto;
  scrollbar-width: thin;
}

.pipeline-flow {
  display: flex;
  align-items: stretch;
  gap: 0.75rem;
  min-width: max-content;
}

.flow-node {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  min-width: 160px;
  max-width: 200px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  transition: all 0.2s ease;
}

.flow-node:hover {
  border-color: var(--accent-purple-border);
  box-shadow: 0 0 15px var(--accent-purple-glow);
}

.flow-node.highlight {
  border-color: var(--accent-purple-border);
  background: linear-gradient(145deg, var(--bg-card) 0%, rgba(157, 78, 221, 0.08) 100%);
}

.node-title {
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 0.25rem;
}

.node-sub {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.node-note {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-purple-bright);
  color: #ffffff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.15rem 0.6rem;
  border-radius: 10px;
  white-space: nowrap;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.flow-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-purple-bright);
  font-size: 1.2rem;
  font-weight: 700;
  padding: 0 0.25rem;
  opacity: 0.7;
}

/* Detailed List Card for Section 3 */
.detailed-flow {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.detailed-step {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: flex-start;
  gap: 1.25rem;
  transition: all 0.2s ease;
}

.detailed-step:hover {
  border-color: var(--accent-purple-border);
  background: var(--bg-card-hover);
}

.step-badge-num {
  font-family: var(--font-heading);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent-purple-light);
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  min-width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.step-body {
  flex-grow: 1;
}

.step-body-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.3rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.step-body-title {
  font-family: var(--font-heading);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
}

.step-body-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.step-body-note {
  font-size: 0.8rem;
  color: var(--accent-purple-light);
  background: var(--accent-purple-soft);
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  border: 1px solid var(--accent-purple-border);
  display: inline-block;
  margin-top: 0.4rem;
}

/* Footer */
footer {
  text-align: center;
  padding-top: 2.5rem;
  margin-top: 1rem;
  border-top: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 0.85rem;
}

footer strong {
  color: var(--text-secondary);
}

@media (max-width: 1050px) {
  .grid-5 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  body {
    padding-inline: clamp(0.75rem, 3vw, 1.5rem);
  }

  .grid-5 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .header-top {
    align-items: stretch;
  }

  .meta-badges {
    justify-content: flex-start;
  }

  .detailed-step {
    gap: 1rem;
  }
}

@media (max-width: 640px) {
  body {
    background-attachment: scroll;
  }

  header {
    border-radius: 12px;
  }

  .header-top,
  .meta-badges {
    align-items: stretch;
  }

  .header-top,
  .meta-badges,
  .section-header {
    gap: 0.75rem;
  }

  .title-area p {
    font-size: 0.95rem;
  }

  .title-area h1 {
    font-size: clamp(1.7rem, 9vw, 2.2rem);
  }

  .meta-badges {
    width: 100%;
  }

  .badge {
    flex: 1 1 auto;
    justify-content: center;
  }

  .grid-5,
  .grid-4 {
    grid-template-columns: 1fr;
  }

  .section-title {
    font-size: 1.25rem;
  }

  .section-number {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
  }

  .pipeline-container {
    padding: 1rem;
    overflow: visible;
  }

  .pipeline-flow {
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.35rem;
    width: 100%;
  }

  .flow-node,
  .flow-node[style] {
    min-width: 0;
    max-width: none;
    padding: 0.95rem 1rem;
  }

  .flow-connector {
    min-height: 1.25rem;
    transform: rotate(90deg);
  }

  .node-note {
    top: -9px;
    font-size: 0.62rem;
  }

  .detailed-step {
    padding: 1rem;
    gap: 0.85rem;
  }

  .step-body-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .step-body-desc {
    overflow-wrap: anywhere;
  }

  .modal-details {
    grid-template-columns: 1fr;
  }

  .step-body-title {
    font-size: 1.05rem;
  }

  footer {
    padding: 1.5rem 0 0;
    font-size: 0.75rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  body::before {
    animation: none;
  }

  .ambient-asset {
    animation: none;
  }

  .modal-backdrop,
  .card-modal {
    animation: none;
  }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const { createElement: h, useEffect, useState } = React;

  const macroSteps = [
    ['Análise de dados', ['Youtube', 'Brutos drive']],
    ['Ingestão de mídia', ['Script de transcrição', 'Ferramenta de transcrição', 'Cortes iniciais via script (ffmpeg)']],
    ['Edição de conteúdo', ['Edição via transcrição']],
    ['Formatação', ['Adaptação para formatos de plataformas ADS (via after effects(?))', 'Conformidade com o playbook de anúncios']],
    ['Distribuição', ['Nomenclatura', 'Local de salvamento']]
  ];

  const catalogCards = [

    return h('ul', { className: 'bullet-list' }, items.map((item) => h('li', { key: item }, link ? h('a', { href: 'https://docs.google.com/spreadsheets/d/1teP2-RDaeuGqxWe9nbAOP-v7tDFPcSDnqdpRuSyXm18/edit?usp=sharing', className: 'link-btn', target: '_blank', rel: 'noopener noreferrer' }, item) : item)));
  }

  function Card({ title, items, step, context, onOpen }) {
    function handleKeyDown(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        onOpen({ title, items, step, context });
      }
    }

    return h('article', {
      className: 'card',
      tabIndex: 0,
      role: 'button',
      'aria-label': `Expandir informações sobre ${title}`,
      onClick: (event) => {
        if (!event.target.closest('a')) onOpen({ title, items, step, context });

    }, step && h('div', { className: 'card-header-step' }, h('span', { className: 'step-tag' }, `Etapa ${step}`)), h('h3', { className: 'card-title' }, title), h('p', { className: 'card-summary' }, context.summary), h(BulletList, { items, link: items[0] === 'Planilha de garimpo ↗' }), h('span', { className: 'card-expand-hint' }, 'Abrir visão detalhada'));
  }

  function CardModal({ card, onClose }) {
    useEffect(() => {
      function handleEscape(event) {
        if (event.key === 'Escape') onClose();
      }

      document.addEventListener('keydown', handleEscape);
      return () => document.removeEventListener('keydown', handleEscape);
    }, [onClose]);

    return h(
      'div',
      { className: 'modal-backdrop', onClick: onClose },
      h(
        'section',
        {
          className: 'card-modal',
          role: 'dialog',
          'aria-modal': 'true',
          'aria-labelledby': 'expanded-card-title',
          onClick: (event) => event.stopPropagation()
        },
        h('button', { className: 'modal-close', type: 'button', onClick: onClose, 'aria-label': 'Fechar visão detalhada' }, '×'),
        card.step && h('div', { className: 'modal-eyebrow' }, `Etapa ${card.step}`),
        h('h2', { className: 'modal-title', id: 'expanded-card-title' }, card.title),
        h('p', { className: 'modal-copy' }, card.context.detail),
        h(
          'div',
          { className: 'modal-details' },
          h('div', { className: 'modal-detail' }, h('strong', null, 'Conteúdo relacionado'), h('span', null, card.items.join(' • '))),
          h('div', { className: 'modal-detail' }, h('strong', null, 'Entregável'), h('span', null, card.context.output)),
          h('div', { className: 'modal-detail' }, h('strong', null, 'Próxima etapa'), h('span', null, card.context.next))
        )
      )
    );
  }

  function Pipeline({ nodes }) {
    return h('div', { className: 'pipeline-container' }, h('div', { className: 'pipeline-flow' }, nodes.flatMap(([title, sub, highlight], index) => [
      h('div', { className: `flow-node${highlight ? ' highlight' : ''}`, key: title }, h('div', { className: 'node-title' }, title), sub && h('div', { className: 'node-sub' }, sub)),
      index < nodes.length - 1 && h('div', { className: 'flow-connector', key: `${title}-connector`, 'aria-hidden': 'true' }, '→')
    ])));
  }

  function DeliveryStep({ step, index }) {
    return h('article', { className: 'detailed-step' }, h('div', { className: 'step-badge-num' }, String(index + 1).padStart(2, '0')), h('div', { className: 'step-body' }, h('div', { className: 'step-body-header' }, h('h3', { className: 'step-body-title' }, step[0])), h('div', { className: 'step-body-desc' }, step[1]), step[2] && h('div', { className: 'step-body-note' }, step[2])));
  }

  function Section({ number, title, children }) {
    return h('section', { className: 'section-block' }, h(SectionHeader, { number, title }), children);
  }

  function AmbientAssets() {
    return h('div', { className: 'ambient-assets', 'aria-hidden': 'true' },
