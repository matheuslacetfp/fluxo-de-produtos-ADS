<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fluxo de Produção de Mídia e Vídeo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

:root {
  --bg-primary: #09090b;
  --bg-surface: #121218;
  --bg-card: #181822;
  --bg-card-hover: #1e1e2c;
  
  --accent-purple: #9d4edd;
  --accent-purple-bright: #b056f5;
  --accent-purple-light: #d8b4fe;
  --accent-purple-glow: rgba(157, 78, 221, 0.25);
  --accent-purple-soft: rgba(157, 78, 221, 0.12);
  --accent-purple-border: rgba(176, 86, 245, 0.35);

  --border-color: #272738;
  --border-subtle: #1f1f2e;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  --font-heading: 'Space Grotesk', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  line-height: 1.6;
  min-height: 100vh;
  padding: clamp(1rem, 4vw, 3.5rem) clamp(0.75rem, 3vw, 1.5rem);
  display: flex;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(157, 78, 221, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(157, 78, 221, 0.05) 0%, transparent 50%);
  background-attachment: fixed;
}

body::before {
  content: '';
  position: fixed;
  inset: -35%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;
  background:
    radial-gradient(ellipse at 18% 25%, rgba(176, 86, 245, 0.18) 0%, transparent 38%),
    radial-gradient(ellipse at 78% 18%, rgba(216, 180, 254, 0.1) 0%, transparent 34%),
    radial-gradient(ellipse at 65% 82%, rgba(94, 53, 145, 0.16) 0%, transparent 42%);
  background-size: 125% 125%;
  filter: blur(18px);
  animation: fluid-gradient 22s ease-in-out infinite alternate;
}

@keyframes fluid-gradient {
  0% {
    transform: translate3d(-4%, -2%, 0) scale(1);
  }
  50% {
    transform: translate3d(3%, 4%, 0) scale(1.06);
  }
  100% {
    transform: translate3d(-2%, 1%, 0) scale(1.02);
  }
}

.container {
  width: 100%;
  max-width: 1240px;
  position: relative;
  z-index: 1;
}

/* Header Section */
header {
  background: linear-gradient(180deg, rgba(24, 24, 34, 0.8) 0%, rgba(18, 18, 24, 0.6) 100%);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: clamp(1.35rem, 4vw, 2.75rem);
  margin-bottom: clamp(2rem, 5vw, 3.5rem);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
}

header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent-purple-light), transparent);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 1.5rem;
}

.title-area h1 {
  font-family: var(--font-heading);
  font-size: clamp(2rem, 5vw, 2.8rem);
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-primary);
  line-height: 1.15;
}

.title-area h1 span {
  color: var(--accent-purple-bright);
  background: linear-gradient(135deg, #c084fc 0%, #9d4edd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.title-area p {
  color: var(--text-secondary);
  font-size: 1.1rem;
  margin-top: 0.6rem;
  font-weight: 400;
}

.meta-badges {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.badge {
  background-color: var(--accent-purple-soft);
  color: var(--accent-purple-light);
  border: 1px solid var(--accent-purple-border);
  padding: 0.4rem 0.9rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--accent-purple-bright);
}

/* Section Headings */
.section-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.section-number {
  font-family: var(--font-heading);
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent-purple-bright);
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.section-title {
  font-family: var(--font-heading);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.section-block {
  margin-bottom: clamp(2.25rem, 5vw, 3.5rem);
}

/* Cards & Grids */
.grid-5 {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1.25rem;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1.25rem;
}

.card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: clamp(1rem, 2vw, 1.5rem);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  display: flex;
  flex-direction: column;
}

.card:hover {
  border-color: var(--accent-purple-border);
  background-color: var(--bg-card-hover);
  transform: translateY(-3px);
  box-shadow: 0 12px 24px -10px var(--accent-purple-glow);
}

.card-header-step {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border-subtle);
}

.step-tag {
  font-family: var(--font-heading);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-purple-light);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card-title {
  font-family: var(--font-heading);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-primary);
}

/* Bullet Lists */
ul.bullet-list {
  list-style: none;
  margin-top: 0.25rem;
}

ul.bullet-list li {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-bottom: 0.6rem;
  position: relative;
  padding-left: 1.4rem;
  line-height: 1.45;
}

ul.bullet-list li:last-child {
  margin-bottom: 0;
}

ul.bullet-list li::before {
  content: "›";
  color: var(--accent-purple-bright);
  font-weight: 800;
  font-size: 1.3rem;
  position: absolute;
  left: 0;
  top: -3px;
}

/* Link Button */
.link-btn {
  color: var(--accent-purple-light);
  text-decoration: none;
  font-weight: 600;
  padding: 0.3rem 0.8rem;
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.2s ease;
}

.link-btn:hover {
  background: var(--accent-purple-bright);
  color: #fff;
  border-color: var(--accent-purple-bright);
}

/* Pipelines / Flow Layouts */
.pipeline-container {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: clamp(1rem, 3vw, 1.75rem);
  overflow-x: auto;
  scrollbar-width: thin;
}

.pipeline-flow {
  display: flex;
  align-items: stretch;
  gap: 0.75rem;
  min-width: max-content;
}

.flow-node {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  min-width: 160px;
  max-width: 200px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  transition: all 0.2s ease;
}

.flow-node:hover {
  border-color: var(--accent-purple-border);
  box-shadow: 0 0 15px var(--accent-purple-glow);
}

.flow-node.highlight {
  border-color: var(--accent-purple-border);
  background: linear-gradient(145deg, var(--bg-card) 0%, rgba(157, 78, 221, 0.08) 100%);
}

.node-title {
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 0.25rem;
}

.node-sub {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.node-note {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-purple-bright);
  color: #ffffff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.15rem 0.6rem;
  border-radius: 10px;
  white-space: nowrap;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.flow-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-purple-bright);
  font-size: 1.2rem;
  font-weight: 700;
  padding: 0 0.25rem;
  opacity: 0.7;
}

/* Detailed List Card for Section 3 */
.detailed-flow {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.detailed-step {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: flex-start;
  gap: 1.25rem;
  transition: all 0.2s ease;
}

.detailed-step:hover {
  border-color: var(--accent-purple-border);
  background: var(--bg-card-hover);
}

.step-badge-num {
  font-family: var(--font-heading);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent-purple-light);
  background: var(--accent-purple-soft);
  border: 1px solid var(--accent-purple-border);
  min-width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.step-body {
  flex-grow: 1;
}

.step-body-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.3rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.step-body-title {
  font-family: var(--font-heading);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
}

.step-body-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.step-body-note {
  font-size: 0.8rem;
  color: var(--accent-purple-light);
  background: var(--accent-purple-soft);
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  border: 1px solid var(--accent-purple-border);
  display: inline-block;
  margin-top: 0.4rem;
}

/* Footer */
footer {
  text-align: center;
  padding-top: 2.5rem;
  margin-top: 1rem;
  border-top: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 0.85rem;
}

footer strong {
  color: var(--text-secondary);
}

@media (max-width: 1050px) {
  .grid-5 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  body {
    padding-inline: clamp(0.75rem, 3vw, 1.5rem);
  }

  .grid-5 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .header-top {
    align-items: stretch;
  }

  .meta-badges {
    justify-content: flex-start;
  }

  .detailed-step {
    gap: 1rem;
  }
}

@media (max-width: 640px) {
  body {
    background-attachment: scroll;
  }

  header {
    border-radius: 12px;
  }

  .header-top,
  .meta-badges {
    align-items: stretch;
  }

  .header-top,
  .meta-badges,
  .section-header {
    gap: 0.75rem;
  }

  .title-area p {
    font-size: 0.95rem;
  }

  .title-area h1 {
    font-size: clamp(1.7rem, 9vw, 2.2rem);
  }

  .meta-badges {
    width: 100%;
  }

  .badge {
    flex: 1 1 auto;
    justify-content: center;
  }

  .grid-5,
  .grid-4 {
    grid-template-columns: 1fr;
  }

  .section-title {
    font-size: 1.25rem;
  }

  .section-number {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
  }

  .pipeline-container {
    padding: 1rem;
    overflow: visible;
  }

  .pipeline-flow {
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.35rem;
    width: 100%;
  }

  .flow-node,
  .flow-node[style] {
    min-width: 0;
    max-width: none;
    padding: 0.95rem 1rem;
  }

  .flow-connector {
    min-height: 1.25rem;
    transform: rotate(90deg);
  }

  .node-note {
    top: -9px;
    font-size: 0.62rem;
  }

  .detailed-step {
    padding: 1rem;
    gap: 0.85rem;
  }

  .step-body-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .step-body-desc {
    overflow-wrap: anywhere;
  }

  .step-body-title {
    font-size: 1.05rem;
  }

  footer {
    padding: 1.5rem 0 0;
    font-size: 0.75rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  body::before {
    animation: none;
  }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const { createElement: h } = React;

  const macroSteps = [
    ['Análise de dados', ['Youtube', 'Brutos drive']],
    ['Ingestão de mídia', ['Script de transcrição', 'Ferramenta de transcrição', 'Cortes iniciais via script (ffmpeg)']],
    ['Edição de conteúdo', ['Edição via transcrição']],
    ['Formatação', ['Adaptação para formatos de plataformas ADS (via after effects(?))', 'Conformidade com o playbook de anúncios']],
    ['Distribuição', ['Nomenclatura', 'Local de salvamento']]
  ];

  const catalogCards = [
    ['Mapeamento quantitativo', ['Youtube Analytics', 'Dados de retenção', 'Métricas']],
    ['Mineração Qualitativa', ['Transcrição', 'Processamento em LLM']],
    ['Triagem por etapa de funil', ['ToFu', 'MoFu']],
    ['Catalogação na planilha de mineração', ['Planilha de garimpo ↗']]
  ];

  const deliverySteps = [
    ['Youtube', 'Analisar e depurar dados'],
    ['Transcrição', 'App Local', 'Avalia validade antes de download do arquivo de vídeo'],
    ['LLM', 'Gemini / Claude'],
    ['Premiere', 'Cortes a partir das transcrições selecionadas pela LLM'],
    ['After Effects', 'Formatação utilizando templates para cada formato específico de mídia ADS'],
    ['Dropbox', 'Nomeação e distribuição seguindo padrão definido'],
    ['Planilha de Performance', 'Análise de resultados a partir de planilha alimentada com dados de cada AD etiquetado com sua respectiva nomenclatura', 'Definição de estratégias futuras']
  ];

  const largeVideoFlow = [
    ['Baixar vídeo bruto', 'youtube', true], ['Primeiro corte', 'Premiere/FFmpeg'], ['Transcrever'], ['LLM', '', true],
    ['Edição'], ['Formatação', 'after effects'], ['Distribuição'], ['Avaliação', '', true]
  ];

  const editingFlow = [
    ['Ingestão de mídia'], ['Cortes', '', true], ['Identificação de etapa', '(cabeça, corpo, cta...)'],
    ['Montagem'], ['Versionamento'], ['Finalização', '', true]
  ];

  function SectionHeader({ number, title }) {
    return h('div', { className: 'section-header' }, h('div', { className: 'section-number' }, number), h('h2', { className: 'section-title' }, title));
  }

  function BulletList({ items, link }) {
    return h('ul', { className: 'bullet-list' }, items.map((item) => h('li', { key: item }, link ? h('a', { href: 'https://docs.google.com/spreadsheets/d/1teP2-RDaeuGqxWe9nbAOP-v7tDFPcSDnqdpRuSyXm18/edit?usp=sharing', className: 'link-btn', target: '_blank', rel: 'noopener noreferrer' }, item) : item)));
  }

  function Card({ title, items, step }) {
    return h('article', { className: 'card' }, step && h('div', { className: 'card-header-step' }, h('span', { className: 'step-tag' }, `Etapa ${step}`)), h('h3', { className: 'card-title' }, title), h(BulletList, { items, link: items[0] === 'Planilha de garimpo ↗' }));
  }

  function Pipeline({ nodes }) {
    return h('div', { className: 'pipeline-container' }, h('div', { className: 'pipeline-flow' }, nodes.flatMap(([title, sub, highlight], index) => [
      h('div', { className: `flow-node${highlight ? ' highlight' : ''}`, key: title }, h('div', { className: 'node-title' }, title), sub && h('div', { className: 'node-sub' }, sub)),
      index < nodes.length - 1 && h('div', { className: 'flow-connector', key: `${title}-connector`, 'aria-hidden': 'true' }, '→')
    ])));
  }

  function DeliveryStep({ step, index }) {
    return h('article', { className: 'detailed-step' }, h('div', { className: 'step-badge-num' }, String(index + 1).padStart(2, '0')), h('div', { className: 'step-body' }, h('div', { className: 'step-body-header' }, h('h3', { className: 'step-body-title' }, step[0])), h('div', { className: 'step-body-desc' }, step[1]), step[2] && h('div', { className: 'step-body-note' }, step[2])));
  }

  function Section({ number, title, children }) {
    return h('section', { className: 'section-block' }, h(SectionHeader, { number, title }), children);
  }

  function App() {
    return h('main', { className: 'container' },
      h('header', null, h('div', { className: 'header-top' }, h('div', { className: 'title-area' }, h('h1', null, 'Fluxo de ', h('span', null, 'Produção de Mídia')), h('p', null, 'Mapeamento, Processamento, Fluxo de Edição e Distribuição de Anúncios')), h('div', { className: 'meta-badges' }, h('span', { className: 'badge' }, 'Workflow 2026'), h('span', { className: 'badge' }, 'Mídia & ADS')))),
      h(Section, { number: '01', title: 'Macrofluxo de Processamento' }, h('div', { className: 'grid-5' }, macroSteps.map(([title, items], index) => h(Card, { key: title, title, items, step: String(index + 1).padStart(2, '0') })))),
      h(Section, { number: '02', title: 'Mineração & Catalogação' }, h('div', { className: 'grid-4' }, catalogCards.map(([title, items]) => h(Card, { key: title, title, items })))),
      h(Section, { number: '03', title: 'Fluxo de Entrega' }, h('div', { className: 'detailed-flow' }, deliverySteps.map((step, index) => h(DeliveryStep, { key: step[0], step, index })))),
      h(Section, { number: '04', title: 'Fluxo Vídeos Grandes' }, h(Pipeline, { nodes: largeVideoFlow })),
      h(Section, { number: '05', title: 'Fluxo de Edição' }, h(Pipeline, { nodes: editingFlow })),
      h('footer', null, h('p', null, 'Playbook de Anúncios & Processos de Vídeo • ', h('strong', null, 'Documentação Interna de Performance')))
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
